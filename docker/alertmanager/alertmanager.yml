global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default

# Notification examples. The stack intentionally starts without external
# credentials, so these receivers are commented out. Uncomment one, replace
# the placeholders, and point route.receiver at its name to enable delivery.
#
#  - name: webhook
#    webhook_configs:
#      - url: "https://example.invalid/alertmanager"
#        send_resolved: true
#
#  - name: email
#    email_configs:
#      - to: "ops@example.invalid"
#        from: "alertmanager@example.invalid"
#        smarthost: "smtp.example.invalid:587"
#        auth_username: "REPLACE_ME"
#        auth_password: "REPLACE_ME"

inhibit_rules:
  - source_matchers:
      - alertname = "APIDown"
    target_matchers:
      - alertname =~ "APIHighErrorRate|APIHighLatency"
    equal:
      - job

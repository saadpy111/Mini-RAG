global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets:
          - qdrant:6333

  - job_name: mongodb
    metrics_path: /metrics
    static_configs:
      - targets:
          - mongodb-exporter:9216

  - job_name: cadvisor
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-exporter:9100
